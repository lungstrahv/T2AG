name: release-structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit-test the release-tree gate
        run: python -B -m unittest tools/test_verify_release_tree.py
      - name: Verify the committed bilingual Git tree
        run: python -B tools/verify_release_tree.py --tree HEAD

